<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>따끈따끈 자동차 놀이</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(#83ddff 0%, #dff7ff 53%, #7bd46c 54%, #41a947 100%);
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sky-shine {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 12%, rgba(255, 244, 112, 0.86) 0 46px, transparent 48px),
        radial-gradient(circle at 18% 17%, rgba(255,255,255,0.45) 0 70px, transparent 72px);
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      width: 145px;
      height: 52px;
      border-radius: 999px;
      background: white;
      opacity: 0.92;
      animation: cloudMove linear infinite;
      cursor: pointer;
      pointer-events: auto;
      z-index: 4;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 62px;
      height: 62px;
      left: 22px;
      top: -28px;
    }

    .cloud::after {
      width: 76px;
      height: 76px;
      right: 18px;
      top: -38px;
    }

    .cloud.one { top: 105px; left: -170px; animation-duration: 25s; }
    .cloud.two { top: 180px; left: -240px; transform: scale(0.7); animation-duration: 34s; animation-delay: -13s; }
    .cloud.three { top: 60px; left: -210px; transform: scale(0.52); animation-duration: 40s; animation-delay: -25s; }

    #plane-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    #ufo-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
    }

    .ufo {
      position: absolute;
      left: -130px;
      top: 110px;
      width: 104px;
      height: 66px;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 9px 5px rgba(0,0,0,0.22));
      will-change: transform, left, top;
    }

    .ufo-dome {
      position: absolute;
      left: 30px;
      top: 4px;
      width: 45px;
      height: 32px;
      border-radius: 50% 50% 8px 8px;
      background: #bdf7ff;
      border: 4px solid #7b61ff;
      z-index: 2;
      box-shadow: inset 0 6px 0 rgba(255,255,255,0.75);
    }

    .ufo-body {
      position: absolute;
      left: 4px;
      top: 27px;
      width: 96px;
      height: 31px;
      border-radius: 50%;
      background: #c9c2ff;
      border: 5px solid #7b61ff;
      z-index: 3;
    }

    .ufo-body::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff176;
      box-shadow: 25px 1px 0 #80d8ff, 50px 0 0 #ff80ab;
      animation: ufoBlink 0.45s steps(2) infinite;
    }

    .ufo-beam {
      position: absolute;
      left: 34px;
      top: 47px;
      width: 38px;
      height: 34px;
      clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
      background: rgba(210, 255, 120, 0.42);
      z-index: 1;
      animation: beamPulse 0.65s ease-in-out infinite alternate;
    }

    @keyframes ufoBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes beamPulse {
      from { opacity: 0.2; transform: scaleY(0.75); }
      to { opacity: 0.75; transform: scaleY(1.15); }
    }

    .plane {
      position: absolute;
      left: -150px;
      top: 110px;
      width: 128px;
      height: 58px;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      animation: planeFly 2.75s linear forwards, planeWave 0.72s ease-in-out infinite alternate;
      will-change: transform;
      filter: drop-shadow(0 8px 4px rgba(0,0,0,0.18));
    }

    .plane::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 22px;
      width: 92px;
      height: 18px;
      border-radius: 999px 45px 45px 999px;
      background: #ffffff;
      border: 4px solid #5fa8ff;
    }

    .plane::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 18px;
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 28px solid #ffffff;
      filter: drop-shadow(3px 0 0 #5fa8ff);
    }

    .plane-wing {
      position: absolute;
      left: 45px;
      top: 10px;
      width: 44px;
      height: 22px;
      border-radius: 8px 24px 8px 8px;
      background: #d9f0ff;
      border: 4px solid #5fa8ff;
      transform: skewX(-18deg);
      z-index: 2;
    }

    .plane-tail {
      position: absolute;
      left: 2px;
      top: 10px;
      width: 30px;
      height: 30px;
      border-radius: 8px 8px 4px 18px;
      background: #ffcf5a;
      border: 4px solid #5fa8ff;
      transform: rotate(-18deg);
      z-index: 1;
    }

    .plane-window {
      position: absolute;
      left: 72px;
      top: 27px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #8ee7ff;
      z-index: 3;
      box-shadow: -18px 0 0 #8ee7ff;
    }

    .plane:active {
      transform: scale(0.9);
    }

    @keyframes planeFly {
      from { left: -150px; }
      to { left: calc(100vw + 170px); }
    }

    @keyframes planeWave {
      from { margin-top: -24px; }
      to { margin-top: 24px; }
    }

    @keyframes cloudMove {
      from { left: -220px; }
      to { left: calc(100vw + 230px); }
    }

    .top-ui {
      position: absolute;
      z-index: 20;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .score-card,
    .vehicle-card {
      padding: 12px 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      font-weight: 1000;
      color: #263238;
      pointer-events: none;
    }

    .score-card { font-size: 23px; }
    .vehicle-card { font-size: 19px; text-align: right; }

    .message {
      position: absolute;
      z-index: 20;
      top: calc(76px + env(safe-area-inset-top, 0px));
      left: 14px;
      max-width: min(360px, calc(100vw - 28px));
      padding: 10px 15px;
      border-radius: 21px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      font-size: 18px;
      font-weight: 900;
      color: #37474f;
    }

    .tree-lane {
      position: absolute;
      left: 0;
      bottom: 32dvh;
      width: 100%;
      height: 175px;
      overflow: hidden;
      pointer-events: auto;
      z-index: 2;
    }

    .tree-track {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      gap: 46px;
      width: max-content;
      padding-left: 0;
      animation: forestMove 11s linear infinite;
      will-change: transform;
    }

    @keyframes forestMove {
      from { transform: translateX(-18%); }
      to { transform: translateX(-68%); }
    }

    .tree-group {
      display: flex;
      align-items: flex-end;
      gap: 46px;
      flex: 0 0 auto;
      padding-right: 46px;
    }

    .tree {
      position: relative;
      flex: 0 0 auto;
      width: 76px;
      height: var(--h, 130px);
      transform: scale(var(--s, 1));
      transform-origin: center bottom;
      cursor: pointer;
      pointer-events: auto;
    }

    .tree::before {
      content: "";
      position: absolute;
      left: 31px;
      bottom: 0;
      width: 16px;
      height: 58px;
      border-radius: 8px;
      background: #8d5a2b;
    }

    .tree::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 42px;
      width: 86px;
      height: 86px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 45%, #2e9d43 0 30px, transparent 31px),
        radial-gradient(circle at 66% 38%, #55c96a 0 34px, transparent 35px),
        radial-gradient(circle at 50% 24%, #43b95a 0 31px, transparent 32px),
        radial-gradient(circle at 50% 55%, #2e9d43 0 43px, transparent 44px);
    }

    .road {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 34dvh;
      min-height: 205px;
      background: #565656;
      border-top: 13px solid #329f43;
      box-shadow: inset 0 16px 0 rgba(255,255,255,0.06);
      z-index: 3;
    }

    .road-line {
      position: absolute;
      left: 0;
      top: 45%;
      width: 100%;
      height: 13px;
      background: repeating-linear-gradient(90deg, #fff 0 72px, transparent 72px 130px);
      animation: roadSlide 0.85s linear infinite;
    }

    @keyframes roadSlide {
      from { background-position-x: 0; }
      to { background-position-x: -130px; }
    }

    .garage {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      width: min(72vw, 350px);
      height: 220px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      animation: gentleDrive 4.2s ease-in-out infinite;
      will-change: left;
    }

    @keyframes gentleDrive {
      0%, 100% { left: 36%; }
      50% { left: 64%; }
    }

    .jump-layer {
      position: relative;
      width: 185px;
      height: 109px;
      transform-origin: center bottom;
      will-change: transform;
    }

    .jump-layer.jumping {
      animation: bigJump 1.05s cubic-bezier(.18,.82,.22,1) both;
    }

    @keyframes bigJump {
      0% { transform: translateY(0); }
      18% { transform: translateY(-72px); }
      42% { transform: translateY(-145px); }
      65% { transform: translateY(-72px); }
      82% { transform: translateY(0); }
      91% { transform: translateY(-18px); }
      100% { transform: translateY(0); }
    }

    .spin-layer {
      position: relative;
      width: 185px;
      height: 109px;
      transform-origin: center center;
      will-change: transform;
    }

    .spin-layer.flipping {
      animation: flipOneRound 1.05s ease-in-out both;
    }

    @keyframes flipOneRound {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .garage:active .spin-layer {
      transform: scale(0.92) rotate(-2deg);
    }

    .vehicle {
      position: relative;
      width: 185px;
      height: 109px;
      transform-origin: center bottom;
      filter: drop-shadow(0 18px 8px rgba(0, 0, 0, 0.26));
      animation: wiggle 2.2s ease-in-out infinite;
      transition: transform 0.12s ease-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.2deg); }
    }

    .vehicle .top {
      position: absolute;
      left: 73px;
      top: 11px;
      width: 150px;
      height: 72px;
      border-radius: 42px 42px 12px 12px;
      background: var(--car-main);
      border: 7px solid var(--car-dark);
    }

    .vehicle .body {
      position: absolute;
      left: 17px;
      top: 69px;
      width: 255px;
      height: 77px;
      border-radius: 33px 44px 27px 27px;
      background: var(--car-sub);
      border: 7px solid var(--car-dark);
    }

    .vehicle .window {
      position: absolute;
      top: 25px;
      width: 49px;
      height: 36px;
      border-radius: 14px;
      background: #bdf0ff;
      border: 5px solid #fff;
      z-index: 2;
    }

    .vehicle .window.left { left: 88px; }
    .vehicle .window.right { left: 148px; }

    .vehicle .light {
      position: absolute;
      top: 93px;
      width: 25px;
      height: 21px;
      border-radius: 50%;
      background: #fff176;
      box-shadow: 0 0 17px rgba(255, 241, 118, 0.95);
      z-index: 3;
    }

    .vehicle .light.front { right: 5px; }
    .vehicle .light.back { left: 20px; background: #ffcdd2; }

    .vehicle .wheel {
      position: absolute;
      top: 122px;
      width: 59px;
      height: 59px;
      border-radius: 50%;
      background: #202020;
      border: 10px solid #424242;
      animation: wheelSpin 0.43s linear infinite;
      z-index: 4;
    }

    .vehicle .wheel::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: #c8c8c8;
    }

    .vehicle .wheel.left { left: 54px; }
    .vehicle .wheel.right { right: 30px; }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vehicle.bus .top {
      left: 41px;
      top: 17px;
      width: 210px;
      height: 78px;
      border-radius: 28px 28px 10px 10px;
    }

    .vehicle.bus .body {
      left: 18px;
      top: 60px;
      width: 256px;
      height: 91px;
      border-radius: 22px;
    }

    .vehicle.bus .window.left { left: 62px; }
    .vehicle.bus .window.right { left: 125px; }
    .vehicle.bus .window.extra { display: block; left: 188px; }

    .vehicle.truck .top {
      left: 174px;
      width: 84px;
      height: 75px;
      border-radius: 25px 30px 10px 10px;
    }

    .vehicle.truck .body {
      left: 20px;
      width: 245px;
      border-radius: 18px 38px 20px 20px;
    }

    .vehicle.truck .box {
      display: block;
      position: absolute;
      left: 28px;
      top: 36px;
      width: 145px;
      height: 82px;
      border-radius: 18px;
      background: var(--car-main);
      border: 7px solid var(--car-dark);
      z-index: 1;
    }

    .vehicle.police .siren {
      display: block;
      position: absolute;
      left: 130px;
      top: -6px;
      width: 42px;
      height: 25px;
      border-radius: 15px 15px 4px 4px;
      background: linear-gradient(90deg, #2979ff 0 50%, #ff1744 50% 100%);
      border: 5px solid white;
      z-index: 6;
      animation: sirenFlash 0.45s steps(2) infinite;
    }

    @keyframes sirenFlash {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.8); }
    }

    .vehicle.fire .ladder {
      display: block;
      position: absolute;
      left: 52px;
      top: 12px;
      width: 178px;
      height: 20px;
      border: 5px solid #ffe082;
      border-left: none;
      border-right: none;
      transform: rotate(-7deg);
      z-index: 7;
    }

    .vehicle.fire .ladder::before {
      content: "";
      position: absolute;
      inset: 3px 0;
      background: repeating-linear-gradient(90deg, #ffe082 0 8px, transparent 8px 24px);
    }

    .vehicle .extra,
    .vehicle .box,
    .vehicle .siren,
    .vehicle .ladder {
      display: none;
    }

    .pop {
      position: absolute;
      z-index: 30;
      pointer-events: none;
      font-size: 46px;
      font-weight: 1000;
      color: #ffeb3b;
      text-shadow: 3px 3px 0 #f57f17, 0 4px 10px rgba(0, 0, 0, 0.28);
      animation: popUp 0.78s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes popUp {
      0% { transform: translate(-50%, -50%) scale(0.25) rotate(-10deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(-50%, -155%) scale(1.25) rotate(7deg); opacity: 0; }
    }

    .star {
      position: absolute;
      pointer-events: none;
      z-index: 29;
      width: 20px;
      height: 20px;
      background: var(--star-color);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 35%);
      animation: starFly 0.8s ease-out forwards;
    }

    @keyframes starFly {
      from { transform: translate(0, 0) scale(0.3); opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)) scale(1.45) rotate(210deg); opacity: 0; }
    }

    .bottom-buttons {
      position: absolute;
      z-index: 22;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .toy-button {
      border: none;
      padding: 13px 17px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      font-size: 18px;
      font-weight: 1000;
      color: #37474f;
      cursor: pointer;
      pointer-events: auto;
    }

    .toy-button:active {
      transform: scale(0.94);
    }

    @media (max-width: 520px) {
      .tree-lane {
        bottom: 31dvh;
        height: 145px;
      }

      .tree-track {
        gap: 0;
        animation-duration: 9.5s;
      }

      .tree-group {
        gap: 40px;
        padding-right: 40px;
      }

      .tree {
        transform: scale(calc(var(--s, 1) * 0.82));
      }

      .jump-layer,
      .spin-layer,
      .vehicle {
        width: 245px;
        height: 150px;
      }

      .garage {
        bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        height: 205px;
      }

      .vehicle {
        transform: scale(0.92);
      }

      .score-card { font-size: 20px; }
      .vehicle-card { font-size: 16px; }
      .message { top: calc(72px + env(safe-area-inset-top, 0px)); font-size: 16px; }
      .pop { font-size: 39px; }
      .toy-button { font-size: 16px; padding: 12px 14px; }
    }

    /* iPhone/iPad 가로모드 전용 보정 */
    @media (orientation: landscape) and (max-height: 520px) {


@media (orientation: landscape) and (max-height: 520px) {

        .vehicle .wheel.left { left: 36px; }
        .vehicle .wheel.right { right: 18px; }
        .vehicle .light.front { right: 2px; }
      }


      .game {
        height: 100dvh;
        min-height: 100dvh;
      }

      .top-ui {
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
      }

      .score-card,
      .vehicle-card {
        padding: 8px 12px;
        border-radius: 18px;
      }

      .score-card { font-size: 17px; }
      .vehicle-card { font-size: 14px; }

      .message {
        top: calc(50px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        max-width: 260px;
        padding: 7px 11px;
        border-radius: 16px;
        font-size: 13px;
      }

      .cloud {
        width: 112px;
        height: 40px;
      }

      .cloud::before {
        width: 48px;
        height: 48px;
        left: 18px;
        top: -22px;
      }

      .cloud::after {
        width: 58px;
        height: 58px;
        right: 15px;
        top: -29px;
      }

      .cloud.one { top: 62px; }
      .cloud.two { top: 112px; }
      .cloud.three { top: 34px; }

      .tree-lane {
        bottom: 27dvh;
        height: 105px;
      }

      .tree-track {
        animation-duration: 8.2s;
      }

      .tree-group {
        gap: 34px;
        padding-right: 34px;
      }

      .tree {
        width: 54px;
        height: 92px;
        scale: 0.72;
      }

      .tree::before {
        left: 22px;
        width: 12px;
        height: 42px;
      }

      .tree::after {
        bottom: 30px;
        width: 64px;
        height: 64px;
      }

      .road {
        height: 28dvh;
        min-height: 105px;
        border-top-width: 8px;
      }

      .road-line {
        height: 9px;
        top: 47%;
        background: repeating-linear-gradient(90deg, #fff 0 52px, transparent 52px 92px);
      }

      .garage {
        bottom: calc(34px + env(safe-area-inset-bottom, 0px));
        height: 150px;
        width: min(46vw, 300px);
      }

      .jump-layer,
      .spin-layer {
        width: 290px;
        height: 170px;
      }

      .spin-layer {
        scale: 0.68;
      }

      @keyframes gentleDrive {
        0%, 100% { left: 40%; }
        50% { left: 60%; }
      }

      @keyframes bigJump {
        0% { transform: translateY(0); }
        18% { transform: translateY(-42px); }
        42% { transform: translateY(-82px); }
        65% { transform: translateY(-42px); }
        82% { transform: translateY(0); }
        91% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
      }

      .bottom-buttons {
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      }

      .toy-button {
        padding: 8px 12px;
        font-size: 13px;
      }

     .plane {
       scale: 0.76;
       top: 40px !important;
     }

     .ufo {
       scale: 0.78;
       top: 45px !important;
     }

      .pop {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="sky-shine"></div>
    <div class="cloud one" aria-label="보너스 구름"></div>
    <div class="cloud two" aria-label="보너스 구름"></div>
    <div class="cloud three" aria-label="보너스 구름"></div>
    <div id="plane-layer" aria-hidden="false"></div>
    <div id="ufo-layer" aria-hidden="false"></div>

    <section class="top-ui">
      <div class="score-card"><span id="stars">⭐</span> <span id="score">0</span></div>
      <div class="vehicle-card" id="vehicleName">🚗 자동차</div>
    </section>

    <div class="message" id="message">큰 자동차를 눌러봐!</div>

    <div class="tree-lane">
      <div class="tree-track" aria-hidden="true">
        <div class="tree-group">
          <div class="tree" style="--s:1.05"></div>
          <div class="tree" style="--s:.78"></div>
          <div class="tree" style="--s:1.18"></div>
          <div class="tree" style="--s:.9"></div>
          <div class="tree" style="--s:1.02"></div>
          <div class="tree" style="--s:.7"></div>
          <div class="tree" style="--s:1.22"></div>
          <div class="tree" style="--s:.84"></div>
          <div class="tree" style="--s:1.1"></div>
          <div class="tree" style="--s:.76"></div>
          <div class="tree" style="--s:1.16"></div>
          <div class="tree" style="--s:.88"></div>
          <div class="tree" style="--s:1.04"></div>
          <div class="tree" style="--s:.72"></div>
          <div class="tree" style="--s:1.2"></div>
          <div class="tree" style="--s:.82"></div>
        </div>
        <div class="tree-group">
          <div class="tree" style="--s:1.05"></div>
          <div class="tree" style="--s:.78"></div>
          <div class="tree" style="--s:1.18"></div>
          <div class="tree" style="--s:.9"></div>
          <div class="tree" style="--s:1.02"></div>
          <div class="tree" style="--s:.7"></div>
          <div class="tree" style="--s:1.22"></div>
          <div class="tree" style="--s:.84"></div>
          <div class="tree" style="--s:1.1"></div>
          <div class="tree" style="--s:.76"></div>
          <div class="tree" style="--s:1.16"></div>
          <div class="tree" style="--s:.88"></div>
          <div class="tree" style="--s:1.04"></div>
          <div class="tree" style="--s:.72"></div>
          <div class="tree" style="--s:1.2"></div>
          <div class="tree" style="--s:.82"></div>
        </div>
      </div>
    </div>

    <div class="road">
      <div class="road-line"></div>
    </div>

    <button class="garage" id="garage" aria-label="자동차 누르기">
      <div class="jump-layer" id="jumpLayer">
        <div class="spin-layer" id="spinLayer">
          <div class="vehicle car" id="vehicle" style="--car-main:#ff5252; --car-sub:#ff7043; --car-dark:#c62828;">
            <div class="box"></div>
            <div class="siren"></div>
            <div class="ladder"></div>
            <div class="top"></div>
            <div class="window left"></div>
            <div class="window right"></div>
            <div class="window extra"></div>
            <div class="body"></div>
            <div class="light back"></div>
            <div class="light front"></div>
            <div class="wheel left"></div>
            <div class="wheel right"></div>
          </div>
        </div>
      </div>
    </button>

    <section class="bottom-buttons">
      <button class="toy-button" id="changeButton">🚙 다른 차</button>
      <button class="toy-button" id="resetButton">🔄 다시</button>
    </section>
  </main>

  <script>
    const game = document.getElementById('game');
    const planeLayer = document.getElementById('plane-layer');
    const ufoLayer = document.getElementById('ufo-layer');
    const garage = document.getElementById('garage');
    const jumpLayer = document.getElementById('jumpLayer');
    const spinLayer = document.getElementById('spinLayer');
    const vehicle = document.getElementById('vehicle');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const vehicleNameEl = document.getElementById('vehicleName');
    const changeButton = document.getElementById('changeButton');
    const resetButton = document.getElementById('resetButton');

    let score = 0;
    let currentIndex = 0;
    let jumping = false;

    const vehicles = [
      { type: 'car', name: '🚗 빨간 자동차', main: '#ff5252', sub: '#ff7043', dark: '#c62828', sound: '빵빵!', freq1: 360, freq2: 280 },
      { type: 'bus', name: '🚌 노란 버스', main: '#ffd54f', sub: '#ffca28', dark: '#f57f17', sound: '빵빵!', freq1: 260, freq2: 210 },
      { type: 'police', name: '🚓 경찰차', main: '#ffffff', sub: '#64b5f6', dark: '#1565c0', sound: '삐용!', freq1: 520, freq2: 760 },
      { type: 'fire', name: '🚒 소방차', main: '#f44336', sub: '#e53935', dark: '#b71c1c', sound: '애앵!', freq1: 440, freq2: 620 },
      { type: 'truck', name: '🚚 트럭', main: '#8d6e63', sub: '#a1887f', dark: '#4e342e', sound: '부웅!', freq1: 180, freq2: 130 }
    ];

    const messages = [
      '잘했어! 또 눌러볼까?',
      '우와! 별이 반짝반짝!',
      '자동차가 신났어!',
      '한 번 더 눌러봐!',
      '최고야! 부릉부릉!'
    ];

    const starColors = ['#ffeb3b', '#ff80ab', '#80d8ff', '#b9f6ca', '#ffd180', '#ea80fc'];

    function setVehicle(index) {
      const item = vehicles[index];
      vehicle.className = 'vehicle ' + item.type;
      vehicle.style.setProperty('--car-main', item.main);
      vehicle.style.setProperty('--car-sub', item.sub);
      vehicle.style.setProperty('--car-dark', item.dark);
      vehicleNameEl.textContent = item.name;
      messageEl.textContent = item.name + '를 눌러봐!';
    }

    function playTone(item) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = item.type === 'truck' ? 'sawtooth' : 'square';
      osc.frequency.setValueAtTime(item.freq1, ctx.currentTime);
      osc.frequency.setValueAtTime(item.freq2, ctx.currentTime + 0.12);
      osc.frequency.setValueAtTime(item.freq1, ctx.currentTime + 0.22);

      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.34);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }

    function playPlaneSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(720, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.42);
      gain.gain.setValueAtTime(0.13, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.46);
    }

    function makePop(x, y, text) {
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.textContent = text;
      pop.style.left = x + 'px';
      pop.style.top = y + 'px';
      game.appendChild(pop);
      setTimeout(() => pop.remove(), 850);
    }

    function updateScoreDisplay() {
      scoreEl.textContent = score;
      const starCount = Math.floor(score / 100) + 1;
      document.getElementById('stars').textContent = '⭐'.repeat(starCount);
    }

    function makeStars(x, y) {
      for (let i = 0; i < 16; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = x + 'px';
        star.style.top = y + 'px';
        star.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
        star.style.setProperty('--dy', (Math.random() * -185 - 25) + 'px');
        star.style.setProperty('--star-color', starColors[Math.floor(Math.random() * starColors.length)]);
        game.appendChild(star);
        setTimeout(() => star.remove(), 850);
      }
    }

    function bounceVehicle() {
      spinLayer.animate([
        { transform: 'scale(1) rotate(0deg)' },
        { transform: 'scale(1.16) rotate(-4deg)' },
        { transform: 'scale(1.03) rotate(4deg)' },
        { transform: 'scale(1) rotate(0deg)' }
      ], {
        duration: 360,
        easing: 'ease-out'
      });
    }

    function randomJump() {
      if (jumping) return;
      jumping = true;

      jumpLayer.classList.remove('jumping');
      spinLayer.classList.remove('flipping');
      void jumpLayer.offsetWidth;
      void spinLayer.offsetWidth;

      jumpLayer.classList.add('jumping');
      spinLayer.classList.add('flipping');

      const rect = garage.getBoundingClientRect();
      makePop(rect.left + rect.width / 2, rect.top + 58, '빙글!');

      setTimeout(() => {
        const landingRect = garage.getBoundingClientRect();
        makePop(landingRect.left + landingRect.width / 2, landingRect.bottom - 58, '쿵!');
        makeStars(landingRect.left + landingRect.width / 2, landingRect.bottom - 70);
      }, 850);

      setTimeout(() => {
        jumpLayer.classList.remove('jumping');
        spinLayer.classList.remove('flipping');
        jumping = false;
      }, 1100);
    }

    function scheduleRandomJump() {
      const delay = 2500 + Math.random() * 4200;
      setTimeout(() => {
        randomJump();
        scheduleRandomJump();
      }, delay);
    }

    function celebrate() {
      const item = vehicles[currentIndex];
      const rect = garage.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      score += 1;
      updateScoreDisplay();
      messageEl.textContent = messages[score % messages.length];

      playTone(item);
      makePop(x, y, item.sound);
      makeStars(x, y);
      bounceVehicle();

      if (score > 0 && score % 5 === 0) {
        setTimeout(nextVehicle, 320);
      }
    }

    function cloudBonus(event) {
      event.stopPropagation();
      const rect = event.currentTarget.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      score += 5;
      updateScoreDisplay();
      messageEl.textContent = '구름 보너스! +5점!';
      makePop(x, y, '+5점!');
      makeStars(x, y);

      event.currentTarget.animate([
        { transform: 'scale(1)', opacity: 0.92 },
        { transform: 'scale(1.25)', opacity: 1 },
        { transform: 'scale(1)', opacity: 0.92 }
      ], {
        duration: 360,
        easing: 'ease-out'
      });
    }

    function treeBonus(event) {
      event.stopPropagation();
      const rect = event.currentTarget.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      score += 3;
      updateScoreDisplay();
      messageEl.textContent = '나무 보너스! +3점!';
      makePop(x, y, '+3점!');
      makeStars(x, y);

      event.currentTarget.animate([
        { transform: 'scale(var(--s, 1)) rotate(0deg)' },
        { transform: 'scale(calc(var(--s, 1) * 1.18)) rotate(-6deg)' },
        { transform: 'scale(var(--s, 1)) rotate(4deg)' },
        { transform: 'scale(var(--s, 1)) rotate(0deg)' }
      ], {
        duration: 360,
        easing: 'ease-out'
      });
    }

    function planeBonus(event) {
      event.stopPropagation();
      const plane = event.currentTarget;
      if (plane.dataset.caught === 'yes') return;
      plane.dataset.caught = 'yes';

      const rect = plane.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      score += 50;
      updateScoreDisplay();
      messageEl.textContent = '비행기 보너스! +50점!';
      playPlaneSound();
      makePop(x, y, '+50점!');
      makeStars(x, y);

      plane.style.pointerEvents = 'none';
      plane.animate([
        { transform: 'scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'scale(1.45) rotate(12deg)', opacity: 1 },
        { transform: 'scale(0.15) rotate(-20deg)', opacity: 0 }
      ], {
        duration: 360,
        easing: 'ease-out'
      });

      setTimeout(() => plane.remove(), 340);
    }

    function playUfoSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(980, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.55);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.58);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    }

    function ufoBonus(event) {
      event.stopPropagation();
      const ufo = event.currentTarget;
      if (ufo.dataset.caught === 'yes') return;
      ufo.dataset.caught = 'yes';

      const rect = ufo.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      score += 100;
      updateScoreDisplay();
      messageEl.textContent = 'UFO 발견! +100점!';
      playUfoSound();
      makePop(x, y, '+100점!');

      for (let i = 0; i < 3; i++) {
        makeStars(x, y);
      }

      ufo.style.pointerEvents = 'none';
      ufo.animate([
        { transform: 'scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'scale(1.65) rotate(24deg)', opacity: 1 },
        { transform: 'scale(0.1) rotate(-45deg)', opacity: 0 }
      ], {
        duration: 420,
        easing: 'ease-out'
      });

      setTimeout(() => ufo.remove(), 400);
    }

    function spawnPlane() {
      const plane = document.createElement('button');
      plane.className = 'plane';
      plane.type = 'button';
      plane.innerHTML = '<span class="plane-tail"></span><span class="plane-wing"></span><span class="plane-window"></span>'; 
      plane.setAttribute('aria-label', '비행기 보너스');
const isLandscape = window.innerWidth > window.innerHeight;

plane.style.top =
  (isLandscape
    ? 25 + Math.random() * 45
    : 72 + Math.random() * 130) + 'px';

      plane.addEventListener('click', planeBonus);
      plane.addEventListener('touchstart', planeBonus, { passive: true });

      planeLayer.appendChild(plane);
      setTimeout(() => plane.remove(), 2700);
    }

    function schedulePlane() {
      const delay = 5000 + Math.random() * 5000;
      setTimeout(() => {
        spawnPlane();
        schedulePlane();
      }, delay);
    }

    function startPlanes() {
      setTimeout(() => {
        spawnPlane();
        schedulePlane();
      }, 1800);
    }

    function spawnUfo() {
      const ufo = document.createElement('button');
      ufo.className = 'ufo';
      ufo.type = 'button';
      ufo.setAttribute('aria-label', 'UFO 보너스');
      ufo.innerHTML = '<span class="ufo-beam"></span><span class="ufo-dome"></span><span class="ufo-body"></span>';

      const startTime = performance.now();
      const duration = 2900;
const isLandscape = window.innerWidth > window.innerHeight;

const baseY = isLandscape
  ? 30 + Math.random() * 45
  : 70 + Math.random() * 135;
      const amp1 = 42 + Math.random() * 28;
      const amp2 = 14 + Math.random() * 18;
      const phase = Math.random() * Math.PI * 2;
      const direction = Math.random() < 0.5 ? 1 : -1;
      let removed = false;

      ufo.style.left = '-135px';
      ufo.style.top = baseY + 'px';

      ufo.addEventListener('click', ufoBonus);
      ufo.addEventListener('touchstart', ufoBonus, { passive: true });
      ufoLayer.appendChild(ufo);

      function moveUfo(now) {
        if (!ufo.isConnected || ufo.dataset.caught === 'yes') return;

        const progress = Math.min((now - startTime) / duration, 1);
        const screenWidth = window.innerWidth;
        const x = -135 + progress * (screenWidth + 300);
        const wave = Math.sin(progress * Math.PI * 7 + phase) * amp1;
        const wiggle = Math.sin(progress * Math.PI * 19 + phase) * amp2;
        const zigzag = Math.sin(progress * Math.PI * 5) > 0 ? 18 : -18;
        const y = baseY + wave + wiggle + zigzag * direction;
        const rotate = Math.sin(progress * Math.PI * 10 + phase) * 13;

        ufo.style.left = x + 'px';
        ufo.style.top = y + 'px';
        ufo.style.transform = 'rotate(' + rotate + 'deg)';

        if (progress < 1) {
          requestAnimationFrame(moveUfo);
        } else if (!removed) {
          removed = true;
          ufo.remove();
        }
      }

      requestAnimationFrame(moveUfo);
    }

    function startUfos() {
      setInterval(spawnUfo, 30000);
    }

    function nextVehicle() {
      currentIndex = (currentIndex + 1) % vehicles.length;
      setVehicle(currentIndex);
      const rect = garage.getBoundingClientRect();
      makePop(rect.left + rect.width / 2, rect.top + 55, '짜잔!');
    }

    garage.addEventListener('click', celebrate);

    document.querySelectorAll('.cloud').forEach(cloud => {
      cloud.addEventListener('click', cloudBonus);
      cloud.addEventListener('touchstart', cloudBonus, { passive: true });
    });

    document.querySelectorAll('.tree').forEach(tree => {
      tree.addEventListener('click', treeBonus);
      tree.addEventListener('touchstart', treeBonus, { passive: true });
    });

    changeButton.addEventListener('click', nextVehicle);

    resetButton.addEventListener('click', () => {
      score = 0;
      updateScoreDisplay();
      currentIndex = 0;
      setVehicle(currentIndex);
      makePop(window.innerWidth / 2, window.innerHeight / 2, '다시!');
    });

    setVehicle(currentIndex);
    updateScoreDisplay();
    scheduleRandomJump();
    startPlanes();
    startUfos();
  </script>
</body>
</html>
